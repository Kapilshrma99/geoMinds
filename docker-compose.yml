version: "3.9"

services:
  db:
    build:
      context: ./backend/db
    container_name: geomind-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geomind}
      POSTGRES_USER: ${POSTGRES_USER:-geomind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geomind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geomind} -d ${POSTGRES_DB:-geomind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.x
    container_name: geomind-geoserver
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
    ports:
      - "8084:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data/

  backend:
    build:
      context: ./backend
    container_name: geomind-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
      - ./backend:/app
      - uploaded_files:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      geoserver:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: geomind-frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  geoserver_data:
  uploaded_files:
